xwayland disable
output * bg #000000 solid_color
default_border none
default_floating_border none
hide_edge_borders both
focus_follows_mouse no
focus_on_window_activation focus
seat * hide_cursor 3000
for_window [app_id="pikiosk-stream"] fullscreen enable

# Report input to kioskd for idle tracking and wake-on-touch.
exec swayidle -w timeout 2 true resume 'curl -fsS -m 2 -X POST http://127.0.0.1/api/activity'
include /etc/pikiosk/sway.d/*
