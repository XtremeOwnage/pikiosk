name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Native arm64, so packages install into the image without emulation.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y mtools xz-utils fdisk e2fsprogs
      - name: Test
        run: go test ./...
      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
      - name: Payload
        run: |
          mkdir -p dist work
          deploy/raspios/payload.sh work "$VERSION"
          tar -C work -czf dist/pikiosk-arm64.tar.gz pikiosk
          cp deploy/raspios/get.sh dist/get.sh
      - name: Image
        run: |
          curl -fsSL -o raspios.img.xz https://downloads.raspberrypi.com/raspios_lite_arm64_latest
          xz -d raspios.img.xz
          # Bake in every package, so the first boot needs no internet.
          sudo deploy/raspios/preinstall.sh raspios.img
          sudo chown "$(id -u):$(id -g)" raspios.img
          deploy/raspios/build-image.sh raspios.img "" UTC
          xz -T0 -6 -c raspios.img > "dist/pikiosk-${VERSION}-raspios-arm64.img.xz"
      - name: Checksums
        run: |
          cd dist
          for f in *; do sha256sum "$f" > "$f.sha256"; done
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Hand-written notes for this tag, if any, above GitHub's list of changes.
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then cp "$notes" release-notes.md; else : > release-notes.md; fi
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          body_path: release-notes.md
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: pikiosk
          path: dist/
